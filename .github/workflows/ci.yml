name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and smoke-test the Render image
        run: |
          docker build -t lobby-ci .
          container_id=$(docker run --rm -d -p 127.0.0.1:18080:10000 -e PORT=10000 lobby-ci)
          trap 'docker stop "$container_id" >/dev/null' EXIT
          if ! response=$(curl -fsS --retry 8 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:18080/healthz); then
            docker logs "$container_id"
            exit 1
          fi
          test "$response" = '{"status":"ok"}'
