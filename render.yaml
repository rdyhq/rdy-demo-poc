services:
  - name: lobby-staging
    type: web
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    preDeployCommand: npm run migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lobby-staging-db
          property: connectionString
      # The number of proxies in front of the service. Set it in Render. See the README.
      - key: LOBBY_TRUST_PROXY
        sync: false

databases:
  - name: lobby-staging-db
    region: oregon
    plan: 0.5c-1g
    postgresMajorVersion: "17"
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
